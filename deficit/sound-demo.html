<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deficit sound demo</title>
<style>body{background:#fdf6ec;color:#4a4063;font:18px monospace;max-width:520px;margin:24px auto;padding:0 16px}h1{font-size:22px}button{font:inherit;display:block;width:100%;text-align:left;margin:10px 0;padding:12px;background:#cdeffd;color:#4a4063;border:3px solid #4a4063;box-shadow:4px 4px 0 #a2d2ff;cursor:pointer}button:active{transform:translate(2px,2px);box-shadow:none}small{display:block;opacity:.75}#mute{background:#ffe5a3}</style></head><body>
<h1>Deficit · SFX demo</h1><p>Tap a button to hear each sound (Web Audio, no files). Sounds start muted-safe: nothing plays until you tap.</p>
<button id="mute">🔊 Sound ON (tap to mute)</button><div id="list"></div>
<script>
const SFX={"add":{"label":"Add calories (+100)","desc":"Short soft upward blip on each tap.","wave":"square","notes":[660,880],"step":40,"gain":0.05},"remove":{"label":"Remove calories (−100)","desc":"Same blip, inverted downward.","wave":"square","notes":[880,660],"step":40,"gain":0.05},"chip":{"label":"Quick-add chip (+50/+250/+500)","desc":"Coin pickup; bigger chips add a third note.","wave":"square","notes":[988,1319],"step":60,"gain":0.05},"finish":{"label":"Finish / lock day","desc":"Satisfying \"save point\" chime, rising arpeggio.","wave":"triangle","notes":[523,659,784,1047],"step":90,"gain":0.08},"pound":{"label":"Pound crossed (+1 lb)","desc":"Classic 1-up: quick 6-note rising run.","wave":"square","notes":[659,784,1319,1047,1175,1568],"step":70,"gain":0.06},"goal":{"label":"Goal milestone (every 10%)","desc":"Mini fanfare: two held chords, triangle.","wave":"triangle","notes":[523,659,784,0,659,784,1047],"step":120,"gain":0.08},"streak":{"label":"Streak extended","desc":"Two bright sparkle pings.","wave":"sine","notes":[1568,2093],"step":80,"gain":0.06},"surplus":{"label":"Surplus warning (day goes negative)","desc":"Gentle low two-note \"uh-oh\", never harsh.","wave":"triangle","notes":[392,311],"step":140,"gain":0.07},"nav":{"label":"Nav / date change","desc":"Tiny tick, barely there.","wave":"square","notes":[1200],"step":25,"gain":0.03},"error":{"label":"Error / invalid input","desc":"Low buzzy double bonk.","wave":"sawtooth","notes":[147,0,147],"step":70,"gain":0.05}};
let ctx=null,muted=false;
function tone(ctx,wave,f,t,d,g){if(!f)return;const o=ctx.createOscillator(),a=ctx.createGain();o.type=wave;o.frequency.value=f;a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+0.005);a.gain.exponentialRampToValueAtTime(0.0001,t+d/1000);o.connect(a).connect(ctx.destination);o.start(t);o.stop(t+d/1000+0.02);}
function playSfx(ctx,s){const t0=ctx.currentTime+0.01;s.notes.forEach((f,i)=>tone(ctx,s.wave,f,t0+i*s.step/1000,s.step*1.2,s.gain));}
const list=document.getElementById('list');
for(const [id,s] of Object.entries(SFX)){const b=document.createElement('button');b.innerHTML='▶ '+s.label+'<small>'+s.desc+' ('+s.wave+')</small>';b.onclick=()=>{if(muted)return;ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();playSfx(ctx,s);};list.appendChild(b);}
document.getElementById('mute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇 Sound OFF (tap to unmute)':'🔊 Sound ON (tap to mute)';};
</script></body></html>
