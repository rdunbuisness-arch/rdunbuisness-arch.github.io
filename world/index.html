const map=[];for(let y=0;y<MH;y++){map.push([]);for(let x=0;x<MW;x++)map[y].push(G)}

const HX=52.5,HY=11.5,clipX=y=>coastX(y)+4;

for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(map[y][x]===SAND&&[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>map[y+b][x+a]===ROCK).length>=3)map[y][x]=ROCK;

for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(((x-pond.x)/pond.rx)**2+((y-pond.y)/pond.ry)**2<1)map[y][x]=W;
// path: 2-tile-wide orthogonal runs, every block aligned to the 2x2 grid so one dirt image = one block
const pdir=[];for(let y=0;y<MH;y++)pdir.push(new Array(MW).fill(null));
function pathRun(pts){for(let i=0;i<pts.length-1;i++){const[ax,ay]=pts[i],[bx,by]=pts[i+1],h=ay===by;
 for(let k=0;k<=Math.abs(h?bx-ax:by-ay);k++){const cx=h?Math.min(ax,bx)+k:ax,cy=h?ay:Math.min(ay,by)+k;
  for(const[dx,dy]of[[0,0],[1,0],[0,1],[1,1]]){const x=cx*2+dx,y=cy*2+dy;if(map[y]&&map[y][x]===G){map[y][x]=P;pdir[y][x]=pdir[y][x]==="v"?"v":(h?"h":"v")}}}}}

 const n=isPB(bx,by-1),e=isPB(bx+1,by),so=isPB(bx,by+1),w=isPB(bx-1,by),k=(n?"n":"")+(e?"e":"")+(so?"s":"")+(w?"w":"");

function move(c,dx,dy,dt){c.moving=!!(dx||dy);if(!c.moving){c.f=0;return}

  else{const gi=hash((tx>>1)*13+5,(ty>>1)*3+9)<.5&&ok(SHEETS.rg_b)?SHEETS.rg_b:SHEETS.rg;if(ok(gi)){const q=gi.naturalWidth/2;ctx.drawImage(gi,(tx%2)*q,(ty%2)*q,q,q,sx,sy,T,T)}else ctx.drawImage(rockT,sx,sy)}}

 for(let ty=y0;ty<y1;ty++)for(let tx=x0;tx<x1;tx++){const t=map[ty][tx];if(t===W||t===P)continue;const sx=tx*T-cx,sy=ty*T-cy;

 for(const f of flowers){const sx=f.x-cx,sy=f.y-cy;if(sx<-4||sy<-4||sx>VW+4||sy>VH+4)continue;const s=Math.sin(time*2+f.p)>.6?1:0;ctx.fillStyle="#3f7a2e";ctx.fillRect(sx,sy+1,1,2);ctx.fillStyle=f.c;ctx.fillRect(sx-1+s,sy,3,1);ctx.fillRect(sx+s,sy-1,1,3);ctx.fillStyle="#ffe9a0";ctx.fillRect(sx+s,sy,1,1)}
