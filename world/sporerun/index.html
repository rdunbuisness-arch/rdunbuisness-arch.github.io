<script>
"use strict";
let HUD=32,VW=640,VH=480,CX=0,CY=0;const T=32,W=20,H=15,C=document.getElementById('c'),X=C.getContext('2d');X.imageSmoothingEnabled=false;

const IMG={};

 if(b<=1)return s;const src=sx.getImageData(0,0,img.width,img.height).data,o=document.createElement('canvas');o.width=tw;o.height=Math.round(img.height/b);
 const ox=o.getContext('2d'),d=ox.createImageData(o.width,o.height);
 for(let y=0;y<o.height;y++)for(let x=0;x<tw;x++){const si=((Math.floor(y*b+b/2))*img.width+Math.floor(x*b+b/2))*4,di=(y*tw+x)*4;for(let k=0;k<4;k++)d.data[di+k]=src[si+k];}
 ox.putImageData(d,0,0);return o;}
function flip(c){const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const x=o.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return o;}
function keyBg(c,mode){const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),D=d.data,hx=typeof mode==='string'&&mode[0]==='#',kr=hx?parseInt(mode.slice(1,3),16):D[0],kg=hx?parseInt(mode.slice(3,5),16):D[1],kb=hx?parseInt(mode.slice(5,7),16):D[2];
 for(let i=0;i<D.length;i+=4){const r=D[i],g=D[i+1],b=D[i+2];
  if(mode==='magenta'?(r>170&&b>170&&g<110&&Math.abs(r-b)<70):(Math.abs(r-kr)+Math.abs(g-kg)+Math.abs(b-kb)<(hx?30:48)))D[i+3]=0;}x.putImageData(d,0,0);return c;}
const loads=fetch(A+'manifest.json').then(r=>r.json()).catch(()=>({})).then(m=>{FILES=m;return Promise.all(Object.entries(m).map(([k,e])=>new Promise(r=>{const i=new Image();
 i.onload=()=>{IMG[k]=e.key?keyBg(norm(i,e.grid),e.key):norm(i,e.grid);r()};i.onerror=()=>r();i.src=A+e.file;})));});
// ---------- audio (tiny synth) ----------
let AC=null;function beep(f,d=.08,type='square',v=.05,slide=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
// ---------- map ----------
const MAPS=[
"TTTTTTTTTTTTTTTTTTTT",
"T..D......r........T",
"T.....r........Dr..T",
"T.r.....D.......B..T",
"T...........rr.....T",
"T..D...B.......D...T",
"T......r...........T",
"T.r.........D...r..T",
"T......D.........r.T",
"T...r.......B......T",
"T..........r....D..T",
"T.D...r.........r..T",
"T........D....r....T",
"T...B..........D...T",
"TTTTTTTTTTTTTTTTTTTT"];
let G,game,started=false,TIMERS=[];const later=(f,ms)=>TIMERS.push(setTimeout(f,ms));const rnd=(a,b)=>a+Math.random()*(b-a);
const BOX={T:[0,0,32,32],r:[9,16,23,25],B:[7,15,24,27]};
function blocked(tx,ty){if(tx<0||ty<0||tx>=W||ty>=H)return true;const c=G[ty][tx];return c==='T'||c==='r'||c==='B';}
function solid(tx,ty){if(tx<0||ty<0||tx>=W||ty>=H)return true;const c=G[ty][tx];return c==='T'||c==='r'||c==='B';}
function hitsWall(x,y,r){const x0=Math.floor((x-r)/T),x1=Math.floor((x+r)/T),y0=Math.floor((y-r)/T),y1=Math.floor((y+r)/T);
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(tx<0||ty<0||tx>=W||ty>=H)return true;const b=BOX[G[ty][tx]];if(!b)continue;
  const bx=tx*T,by=ty*T;if(x+r>bx+b[0]&&x-r<bx+b[2]&&y+r>by+b[1]&&y-r<by+b[3])return true;}return false;}
// BFS distance field from the player's tile (rocks/bushes/trees block); robin walks downhill
function bfs(sx,sy){const D=new Int16Array(W*H).fill(-1),q=[sx+sy*W];D[q[0]]=0;
 for(let i=0;i<q.length;i++){const c=q[i],x=c%W,y=(c/W)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(blocked(nx,ny))continue;const n=nx+ny*W;if(D[n]<0){D[n]=D[c]+1;q.push(n);}}}return D;}
function freeSpot(minD){for(let n=0;n<500;n++){const tx=1+Math.floor(Math.random()*(W-2)),ty=1+Math.floor(Math.random()*(H-2));if(G[ty][tx]!=='.')continue;const x=tx*T+16,y=ty*T+16;
 if(Math.hypot(x-game.p.x,y-game.p.y)<minD)continue;if(game.dews.some(d=>Math.hypot(d.x-x,d.y-y)<96))continue;return{x,y};}return{x:5*T+16,y:7*T+16};}
const keys={};let touch=null;
function reset(){TIMERS.forEach(clearTimeout);TIMERS=[];G=MAPS.map(r=>r.split(''));
 game={t:90,state:started?'ready':'title',planted:0,total:10,time:0,
  p:{x:10*T+16,y:7*T+16,vx:0,vy:0,face:1,anim:0,inv:0,boost:0,kb:{x:0,y:0},idle:0,dew:0},
  robin:{x:17*T+16,y:12*T+16,hop:0,hopT:0,fx:0,fy:0,tx:0,ty:0,z:0,face:-1,peck:0},
  dews:[],parts:[],feathers:[],flies:[],pops:[],floats:[],shake:0,sprouts:{}};
 for(let i=0;i<3;i++)game.dews.push(Object.assign(freeSpot(80),{ph:Math.random()*6,respawn:0}));
 document.getElementById('end').style.display='none';window.__game=game;Object.assign(window.__game,api);}
// ---------- input ----------
function start(){if(game.state!=='title'&&game.state!=='ready')return;started=true;game.state='play';game.time=0;for(const k in keys)keys[k]=0;document.getElementById('title0').style.display='none';beep(660,.1);}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.repeat)return;if(game.state==='title'||game.state==='ready'){start();return;}if(e.key.toLowerCase()==='r'&&game.state!=='play')reset();if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;});
C.addEventListener('pointerdown',e=>{if(game.state==='title'||game.state==='ready'){start();return;}touch={sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,id:e.pointerId};C.setPointerCapture(e.pointerId);});
C.addEventListener('pointermove',e=>{if(touch&&touch.id===e.pointerId){touch.x=e.clientX;touch.y=e.clientY;}});
const endT=e=>{if(touch&&touch.id===e.pointerId)touch=null;};C.addEventListener('pointerup',endT);C.addEventListener('pointercancel',endT);
// ---------- fx ----------
function burst(x,y,n,col,sp=60,life=.5){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*.3,sp);game.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,life,max:life,col,sz:Math.random()<.5?2:3});}}
function floatText(x,y,txt,col){game.floats.push({x,y,txt,col,life:1});}
// ---------- update ----------
function update(dt){const g=game;g.time+=dt;
 g.parts=g.parts.filter(p=>(p.life-=dt)>0);for(const p of g.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.vx*=.96;}
 g.pops=g.pops.filter(q=>(q.t+=dt)<.45);g.feathers=g.feathers.filter(q=>(q.t+=dt)<.4);
 // fireflies drift in as dusk falls
 {const dusk=Math.max(0,Math.min(1,(30-g.t)/30)),want=g.state==='play'||g.state==='lose'?Math.round(dusk*10):0;
  while(g.flies.length<want){const e=Math.random()<.5;g.flies.push({x:e?(Math.random()<.5?-8:648):rnd(40,600),y:e?rnd(40,440):(Math.random()<.5?-8:488),ph:Math.random()*6,a:0,tx:rnd(48,592),ty:rnd(48,432)});}
  for(const f of g.flies){f.ph+=dt;f.a=Math.min(1,f.a+dt);const dx=f.tx-f.x,dy=f.ty-f.y;if(Math.hypot(dx,dy)<8){f.tx=rnd(48,592);f.ty=rnd(48,432);}
   f.x+=dx*.25*dt+Math.sin(f.ph*2.3)*12*dt;f.y+=dy*.25*dt+Math.cos(f.ph*1.7)*12*dt;}}g.floats=g.floats.filter(f=>(f.life-=dt)>0);for(const f of g.floats)f.y-=24*dt;
 for(const k in g.sprouts)g.sprouts[k]+=dt;g.shake=Math.max(0,g.shake-dt*30);

 g.t-=dt;const p=g.p;
 let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(touch){const dx=touch.x-touch.sx,dy=touch.y-touch.sy,m=Math.hypot(dx,dy);if(m>8){ix=dx/m;iy=dy/m;if(m>60){touch.sx=touch.x-dx/m*60;touch.sy=touch.y-dy/m*60;}}}
 const im=Math.hypot(ix,iy);if(im>1){ix/=im;iy/=im;}
 p.boost=Math.max(0,p.boost-dt);p.inv=Math.max(0,p.inv-dt);
 const sp=(p.boost>0?200:130);
 const acc=1-Math.pow(.0005,dt);p.vx+=(ix*sp-p.vx)*acc;p.vy+=(iy*sp-p.vy)*acc;
 let mx=(p.vx+p.kb.x)*dt,my=(p.vy+p.kb.y)*dt;p.kb.x*=Math.pow(.002,dt);p.kb.y*=Math.pow(.002,dt);
 const R=9;if(!hitsWall(p.x+mx,p.y,R))p.x+=mx;else{p.vx=0;p.kb.x=0;}if(!hitsWall(p.x,p.y+my,R))p.y+=my;else{p.vy=0;p.kb.y=0;}
 const moving=Math.hypot(p.vx,p.vy)>20;if(ix)p.face=ix>0?1:-1;if(Math.abs(ix)>.3||Math.abs(iy)>.3){p.dx=Math.abs(ix)>.3?Math.sign(ix):0;p.dy=Math.abs(iy)>.3?Math.sign(iy):0;}p.anim=moving?p.anim+dt*(p.boost>0?16:11):0;p.idle=moving?0:p.idle+dt;
 if(p.boost>0&&Math.random()<.6)g.parts.push({x:p.x+rnd(-5,5),y:p.y+10,vx:0,vy:-10,life:.3,max:.3,col:'#9ff',sz:2});
 // plant
 const PCY=p.y-2,tx=Math.floor(p.x/T),ty=Math.floor(PCY/T);
 if(G[ty][tx]==='D'){G[ty][tx]='P';g.planted++;g.t+=5;g.sprouts[tx+','+ty]=0;g.shake=4;burst(tx*T+16,ty*T+16,18,'#f3e9c6',70,.6);burst(tx*T+16,ty*T+16,8,'#d8402c',50,.5);
  floatText(tx*T+16,ty*T,'+5s','#ffe66b');beep(520,.09);later(()=>beep(780,.12),70);
  g.pops.push({x:tx*T+16,y:ty*T+12,t:0});if(g.planted>=g.total){for(let i=0;i<4;i++)burst(p.x,p.y,16,['#ffe66b','#d8402c','#fff','#9ff'][i],140,.9);return finish(true);}}
 // dew
 for(const d of g.dews){d.ph+=dt*4;if(d.respawn>0){d.respawn-=dt;if(d.respawn<=0)Object.assign(d,freeSpot(120));continue;}
  if(Math.hypot(d.x-p.x,d.y-(p.y-2))<22){d.respawn=4;p.dew++;burst(d.x,d.y,10,'#bff',50,.4);beep(900+p.dew*150,.07,'sine',.07);
   if(p.dew>=3){p.dew=0;p.boost=2;floatText(p.x,p.y-20,'ZOOM!','#9ff');beep(400,.25,'sawtooth',.04,800);}else floatText(d.x,d.y-10,p.dew+'/3','#bff');}}
 // robin: hops in arcs toward player; idle player => faster hops
 const r=g.robin;r.peck=Math.max(0,r.peck-dt);r.rest=Math.max(0,(r.rest||0)-dt);
 const hunt=p.idle>1.0&&r.rest<=0; // idle player: mildly faster hops
 if(r.hop>0){r.hopT+=dt;const k=Math.min(1,r.hopT/r.hop);const nx=r.fx+(r.tx-r.fx)*k,ny=r.fy+(r.ty-r.fy)*k;
  if(!hitsWall(nx,ny,7)){r.x=nx;r.y=ny;}else if(!hitsWall(nx,r.y,7))r.x=nx;else if(!hitsWall(r.x,ny,7))r.y=ny; // wall-slide
  r.z=Math.sin(k*Math.PI)*8;if(k>=1){r.hop=0;r.z=0;r.wait=hunt?.3:.45;}}
 else{r.wait=(r.wait||0)-dt;if(r.wait<=0&&r.rest<=0){
  // target: next tile downhill on the BFS field toward the player, or the player if adjacent/same tile
  const ptx=Math.floor(p.x/T),pty=Math.floor(p.y/T),rtx=Math.floor(r.x/T),rty=Math.floor(r.y/T);let gx=p.x,gy=p.y;
  if(!blocked(ptx,pty)&&(Math.abs(ptx-rtx)+Math.abs(pty-rty)>1)){const D=bfs(ptx,pty),cur=D[rtx+rty*W];let best=null,bd=cur<0?1e9:cur;
   for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=rtx+dx,ny=rty+dy;if(blocked(nx,ny))continue;const d=D[nx+ny*W];if(d>=0&&d<bd){bd=d;best=[nx,ny];}}
   if(best){gx=best[0]*T+16;gy=best[1]*T+16;}}
  const dx=gx-r.x,dy=gy-r.y,m=Math.hypot(dx,dy)||1,L=Math.min(m,hunt?34:28);
  r.fx=r.x;r.fy=r.y;r.tx=r.x+dx/m*L+rnd(-3,3);r.ty=r.y+dy/m*L+rnd(-3,3);r.hop=hunt?.26:.3;r.hopT=0;r.face=(p.x-r.x)>0?1:-1;}}
 if(p.inv<=0&&r.rest<=0&&Math.hypot(r.x-p.x,r.y-p.y)<18){const ax=p.x-r.x,ay=p.y-r.y,am=Math.hypot(ax,ay)||1;

  let bx=ax/am,by=ay/am,bs=-1e9;for(let a=0;a<16;a++){const ux=Math.cos(a*Math.PI/8),uy=Math.sin(a*Math.PI/8);let free=0;
   for(let d=8;d<=64;d+=8){if(hitsWall(p.x+ux*d,p.y+uy*d,10))break;free=d;}const sc=free+(ux*ax+uy*ay)/am*28;if(sc>bs){bs=sc;bx=ux;by=uy;}}
  p.kb.x=bx*340;p.kb.y=by*340;p.inv=2.0;g.t-=3;g.shake=8;r.peck=.45;r.hop=0;r.z=0;g.hitFlash=.15;
  // robin hops back and rests ~1s
  r.rest=2.6;r.fx=r.x;r.fy=r.y;const rx=-ax/am,ry=-ay/am;r.tx=r.x+rx*44;r.ty=r.y+ry*44;r.hop=.3;r.hopT=0;r.peck=.45;
  floatText(p.x,p.y-20,'-3s','#ff5a4a');burst(p.x,p.y,12,'#ff8a5a',80,.4);g.feathers.push({x:(p.x+r.x)/2,y:(p.y+r.y)/2-6,t:0});if(!IMG.feather1)for(let i=0;i<8;i++){const a=Math.random()*6.28;g.parts.push({x:r.x,y:r.y-6,vx:Math.cos(a)*70,vy:Math.sin(a)*70-40,life:.6,max:.6,col:i%2?'#865a22':'#f4a024',sz:3});}beep(160,.2,'sawtooth',.07,-100);}
 g.hitFlash=Math.max(0,(g.hitFlash||0)-dt);
 if(g.t<=0){g.t=0;finish(false);}}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
const SHARE_URL=location.origin+location.pathname;
function finish(win){const g=game;g.hitFlash=0;g.p.inv=0;g.shake=0;g.state=win?'win':'lose';const secs=Math.max(0,Math.ceil(g.t)),score=g.planted+secs;g.score=score;
 document.getElementById('title').textContent=win?'All planted!':'Nightfall...';
 document.getElementById('score').textContent='Score '+score;
 document.getElementById('detail').textContent=g.planted+'/10 patches + '+secs+'s left';
 const used=fmt(g.time);
 g.share=win?`🍄 Spore Run: I planted 10 in ${used} — score ${score}. Beat me!`:`🍄 Spore Run: I planted ${g.planted}/10 before nightfall — score ${score}. Beat me!`;
 document.getElementById('share').value=g.share+' '+SHARE_URL;
 g.beat=0;g.slow=1;later(()=>{document.getElementById('end').style.display='flex';},1400);beep(win?660:220,.3,'triangle',.07,win?400:-100);}
document.getElementById('play').onclick=e=>{e.stopPropagation();start();};
document.getElementById('title0').addEventListener('pointerdown',()=>start());
document.getElementById('again').onclick=()=>reset();
const canShare=!!navigator.share&&matchMedia('(pointer:coarse)').matches;if(canShare)document.getElementById('shareBtn').style.display='inline-block';
document.getElementById('shareBtn').onclick=async()=>{try{await navigator.share({title:'Spore Run',text:game.share,url:SHARE_URL});}catch(e){if(e&&e.name!=='AbortError')document.getElementById('copy').click();}};
document.getElementById('copy').onclick=async()=>{const t=document.getElementById('share');let ok=false;
 try{await navigator.clipboard.writeText(t.value);ok=true;}catch(e){try{t.select();ok=document.execCommand('copy');}catch(_){}}
 document.getElementById('copy').textContent=ok?'Copied!':'Select & copy';};
// ---------- draw ----------
function panel(x,y,w,h,s=1){const P=IMG.panel;if(!P){X.fillStyle='rgba(20,12,8,.85)';X.fillRect(x,y,w,h);return;}const b=FILES.panel.inset||5,m=48-2*b,B=b*s;
 const sx=[0,b,48-b],sw=[b,m,b],dx=[x,x+B,x+w-B],dw=[B,w-2*B,B],dy=[y,y+B,y+h-B],dh=[B,h-2*B,B];
